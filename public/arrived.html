<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>Driver has arrived</title>
<style>
  :root { --bg: #0f1115; --card: #191c23; --line: #2a2f3a; --text: #f2f4f8; --muted: #98a1b3; --accent: #3ddc84; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 36px 28px;
    max-width: 26rem;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,.5);
  }
  .badge {
    width: 64px; height: 64px; margin: 0 auto 20px;
    border-radius: 50%;
    background: rgba(61,220,132,.12);
    border: 2px solid var(--accent);
    display: flex; align-items: center; justify-content: center;
  }
  .badge svg { width: 30px; height: 30px; stroke: var(--accent); fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  h1 { margin: 0 0 10px; font-size: 25px; letter-spacing: -.02em; }
  p { margin: 0; color: var(--muted); }
  .time { margin-top: 18px; font-size: 14px; color: var(--muted); }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <svg viewBox="0 0 24 24"><polyline points="4 12.5 9.5 18 20 6.5"/></svg>
    </div>
    <h1 id="headline">Driver has arrived</h1>
    <p id="detail">This tracking link has now expired.</p>
    <div class="time" id="time"></div>
  </div>

<script>
(function () {
  'use strict';
  var token = window.location.pathname.split('/').filter(Boolean).pop();

  fetch('/api/track/' + token, { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (state) {
      if (state.status === 'arrived') {
        if (state.arrivedAt) {
          document.getElementById('time').textContent =
            'Arrived at ' + new Date(state.arrivedAt).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
        }
        return;
      }
      if (state.status === 'expired') {
        document.getElementById('headline').textContent = 'Tracking has ended';
        document.getElementById('detail').textContent = 'This tracking link is no longer active.';
        return;
      }
      if (state.status === 'active') {
        window.location.reload();
        return;
      }
      document.getElementById('headline').textContent = 'Link not found';
      document.getElementById('detail').textContent = 'This tracking link is not valid or has already expired.';
    })
    .catch(function () { /* keep the default message */ });
})();
</script>
</body>
</html>
